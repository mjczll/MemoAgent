# 发行版。配置名为 prod 时加载本文件。
# 工程里没有 application-dev.yml 时会自动切到 prod；也可以手动指定 SPRING_PROFILES_ACTIVE=prod。
# 下面是占位符。发布前改成自己的地址和密钥，这份填好的文件不要放进仓库。
# 模型用云端还是本机由 application.yml 的 memoagent.ai.provider 决定；
# 本文件只覆盖发行环境自己的地址、密钥和模型名。

spring:
  datasource:
    # 发行环境的 MySQL。useSSL 按你的库是否启用加密连接调整
    url: jdbc:mysql://数据库主机:3306/memoagent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: 数据库用户名
    password: 数据库密码
  data:
    redis:
      host: Redis主机
      port: 6379
      # 没有密码就留空
      password: Redis密码
  ai:
    openai:
      # 远程模型的密钥。地址和模型名见下面的 memoagent.ai.cloud
      api-key: 远程模型密钥

memoagent:
  ai:
    provider: cloud
    cloud:
      # OpenAI 兼容地址。Spring AI 1.0.3 会自己补 /v1/chat/completions，这里不要带 /v1
      base-url: https://api.deepseek.com
      model: deepseek-chat

logging:
  level:
    com.memoagent: info
    # 发行环境不打印 SQL
    com.memoagent.mapper: warn
