# 开发版和发行版共用的配置。数据库、Redis、密钥放在各自的 profile 文件里。
# 未手动指定时：classpath 中有 application-dev.yml 就用 dev，否则用 prod。
# 手动指定：SPRING_PROFILES_ACTIVE=dev 或 prod

server:
  # HTTP 端口
  port: 8080

spring:
  application:
    # 进程名，日志里会看到
    name: memo-agent
  jackson:
    # 接口里的时间按上海时区
    time-zone: Asia/Shanghai
    serialization:
      # 日期输出成 2026-10-04T16:24:15，而不是时间戳数字
      write-dates-as-timestamps: false
  ai:
    model:
      # 这里的 openai 指 OpenAI 兼容客户端，云端和本机 Ollama 都走这套协议，所以固定不变。
      # 设成 none 可以完全关掉模型：对话仍能保存，只是不会有回复。
      chat: ${MEMOAGENT_AI_CHAT:openai}

# 模型切换。改 provider 这一行即可，不用动启动参数和 profile：
#   cloud：远程 OpenAI 兼容接口，地址和模型见 cloud 段
#   local：本机 Ollama，地址和模型见 local 段
# 也可以不碰文件，启动时设环境变量 MEMOAGENT_AI_PROVIDER=local。
# 密钥不放在这个共用文件里：开发版放 application-dev.yml，发行版放 application-prod.yml。
# 优先级：命令行参数 > 环境变量 > 各 profile 文件 > 本文件。
memoagent:
  ai:
    provider: ${MEMOAGENT_AI_PROVIDER:local}
    cloud:
      # Spring AI 1.0.3 会自己补 /v1/chat/completions，地址不要带 /v1
      base-url: ${MEMOAGENT_AI_BASE_URL:https://api.xiaomimimo.com}
      model: ${MEMOAGENT_AI_MODEL:mimo-v2.5}
      temperature: 0.4
    local:
      # 同理，本地地址也不要写成 http://localhost:11434/v1
      base-url: ${MEMOAGENT_OLLAMA_BASE_URL:http://localhost:11434}
      # Ollama 不校验密钥，但这个客户端要求值非空
      api-key: ollama
      model: ${MEMOAGENT_OLLAMA_MODEL:gemma4:latest}
      # 本地模型指令遵循弱一些，温度调低更稳
      temperature: 0.2

mybatis-plus:
  configuration:
    # 表字段 user_id 对应 Java 的 userId
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键由数据库自增
      id-type: auto
      # 带 deleted 字段的表做软删除，查询默认不带已删除行
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
