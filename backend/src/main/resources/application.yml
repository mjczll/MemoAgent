# 开发版和发行版共用的配置。数据库、Redis、密钥放在各自的 profile 文件里。
# 未手动指定时：classpath 中有 application-dev.yml 就用 dev，否则用 prod。
# 手动指定：SPRING_PROFILES_ACTIVE=dev 或 prod

server:
  # HTTP 端口
  port: 8080

spring:
  application:
    # 进程名，日志里会看到
    name: memo-agent
  jackson:
    # 接口里的时间按上海时区
    time-zone: Asia/Shanghai
    serialization:
      # 日期输出成 2026-10-04T16:24:15，而不是时间戳数字
      write-dates-as-timestamps: false
  ai:
    model:
      # 这里的 openai 指 OpenAI 兼容客户端，云端和本机 Ollama 都走这套协议，所以固定不变。
      # 设成 none 可以完全关掉模型：对话仍能保存，只是不会有回复。
      chat: ${MEMOAGENT_AI_CHAT:openai}

# 对话模型切换。这里是 dev / prod 共用的唯一开关，两个 profile 文件都不再各自写死 provider：
#   cloud：远程 OpenAI 兼容接口，地址和模型见 cloud 段（各 profile 可覆盖）
#   local：本机 Ollama，地址和模型见 local 段
# 直接改下面 provider 这一行的 local / cloud，改完重启即可，不用动启动参数。
# 切的是「选型」：连接参数始终取本文件的对应段 + 各 profile 的覆盖项，两套在两个环境里都备着。
# 密钥不放在这个共用文件里：开发版放 application-dev.yml，发行版放 application-prod.yml。
# 优先级：命令行参数 > 环境变量（MEMOAGENT_AI_PROVIDER）> 本文件。
memoagent:
  ai:
    provider: ${MEMOAGENT_AI_PROVIDER:local}
    cloud:
      # Spring AI 1.0.3 会自己补 /v1/chat/completions，地址不要带 /v1
      base-url: ${MEMOAGENT_AI_BASE_URL:https://api.xiaomimimo.com}
      model: ${MEMOAGENT_AI_MODEL:mimo-v2.5}
      temperature: 0.4
    local:
      # 同理，本地地址也不要写成 http://localhost:11434/v1
      base-url: ${MEMOAGENT_OLLAMA_BASE_URL:http://localhost:11434}
      # Ollama 不校验密钥，但这个客户端要求值非空
      api-key: ollama
      model: ${MEMOAGENT_OLLAMA_MODEL:gemma4:latest}
      # 本地模型指令遵循弱一些，温度调低更稳
      temperature: 0.2

  # 向量化模型单独选源，和上面的对话模型互不绑定。
  # Spring AI 1.0.3 允许 embedding 用专属 base-url / api-key 覆盖全局连接属性，
  # 所以「对话走云端 + 向量走本机 Ollama」这类混搭只改这里，不需要额外写 Java 配置。
  # 这也是 dev / prod 共用的唯一开关：改下面 provider 这一行的 local / cloud，两个环境都听它。
  #   cloud：阿里云百炼 text-embedding-v3（当前默认，1024 维）；密钥见各 profile 的 cloud.api-key
  #   local：本机 Ollama bge-m3；需要 ollama pull bge-m3 且 11434 在监听
  # 环境变量 MEMOAGENT_EMBEDDING_PROVIDER 仍可临时覆盖；改了文件不生效时先检查是否设过它。
  # 优先级：命令行参数 > 环境变量 > 本文件。
  embedding:
    provider: ${MEMOAGENT_EMBEDDING_PROVIDER:local}
    local:
      base-url: ${MEMOAGENT_OLLAMA_BASE_URL:http://localhost:11434}
      api-key: ollama
      # bge-m3 输出 1024 维，与 vector_asset 的 vector(1024) 对齐
      model: ${MEMOAGENT_EMBEDDING_MODEL:bge-m3}
    cloud:
      # 默认：阿里云百炼的 OpenAI 兼容文本向量（text-embedding-v3）。
      # 地址不带 /v1 —— Spring AI 会补成 /compatible-mode/v1/embeddings。
      # 老域名 dashscope.aliyuncs.com 仍可用；若改用带 WorkspaceId 的新域名，整段替换 base-url。
      base-url: ${MEMOAGENT_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      # 百炼的 DASHSCOPE_API_KEY 与对话接口的密钥不同，必须独立配置，不能沿用全局 key。
      # 这里是兜底：优先读 MEMOAGENT_EMBEDDING_API_KEY，没设则读 DASHSCOPE_API_KEY；
      # 两个 profile 文件都留了填写位，想纯靠配置文件就在那里填实际值（共用文件不要写真实密钥）。
      # 都不设时 cloud 模式启动即报错。若走聚合平台，用三个环境变量覆盖地址 / 模型 ID / Key。
      api-key: "${MEMOAGENT_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:}}"
      # v3 默认输出 1024 维，与 vector_asset 的 vector(1024) 对齐，无需重建表。
      # 也可换 text-embedding-v4（同样默认 1024 维）。换成非 1024 维模型时，
      # 要同步改 db/vector-init.sql 与 memoagent.vector.dimensions 并重建表。
      model: ${MEMOAGENT_CLOUD_EMBEDDING_MODEL:text-embedding-v3}

  # 向量库。只存向量和回指 MySQL 的 source_id，日记/经验/知识的正文与关联仍在 MySQL。
  # 默认开启：每次启动都会连向量库并校验表，容器没起来会导致启动失败。
  # 不想连就设环境变量 MEMOAGENT_VECTOR_ENABLED=false 覆盖（优先级最高）。
  # 注意：dev 和 prod 都会继承这个默认值；若发布环境没有 pgvector 容器，
  #       需在 application-prod.yml 里单独写 memoagent.vector.enabled: false。
  vector:
    enabled: ${MEMOAGENT_VECTOR_ENABLED:true}
    url: ${MEMOAGENT_VECTOR_URL:jdbc:postgresql://localhost:5433/memoagent_vector}
    username: ${MEMOAGENT_VECTOR_USERNAME:memoagent}
    password: ${MEMOAGENT_VECTOR_PASSWORD:memoagent}
    # 表结构见 db/vector-init.sql，不是 Spring AI 默认的 vector_store
    table: vector_asset
    # 必须与建表时的 vector(n) 和 embedding 模型的输出维度三处一致
    dimensions: 1024
    pool-size: 4
    # 写入失败后的自动补偿：失败入队 → 定时重试 → 超过上限标记 abandoned。
    # 表结构见 db/vector-task.sql，第一次启用前必须先执行一次该脚本；
    # 表不存在时补偿任务只会打一条 warn，不影响应用启动和正常保存。
    retry:
      enabled: ${MEMOAGENT_VECTOR_RETRY_ENABLED:true}
      # 启动时比对 MySQL 与向量库，把「有资产、没向量」的登记进队列。
      # 只入队不 embed，成本是两次查询；数据量特别大时可以关掉，改用 POST /api/vector/reindex。
      self-check: ${MEMOAGENT_VECTOR_SELF_CHECK:true}
      # 每轮最多处理多少条到期任务
      batch-size: 20
      # 单条最多重试几次，超过后不再自动重试，保留在表里供排查
      max-attempts: 5
      # 两轮之间的间隔（毫秒）。fixedDelay：上一轮跑完才开始计时，不会堆积
      interval-ms: 60000
      # 启动后延迟多久开始第一轮，避开启动阶段的资源竞争
      initial-delay-ms: 30000

mybatis-plus:
  configuration:
    # 表字段 user_id 对应 Java 的 userId
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键由数据库自增
      id-type: auto
      # 带 deleted 字段的表做软删除，查询默认不带已删除行
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
