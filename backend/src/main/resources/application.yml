server:
  port: 8080

spring:
  application:
    name: memo-agent
  datasource:
    url: jdbc:mysql://localhost:3307/memoagent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: memoagent
    password: memoagent
  data:
    redis:
      host: localhost
      port: 6379
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.memoagent: info
    com.memoagent.mapper: debug
